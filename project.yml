name: AppMobileIOS
options:
  bundleIdPrefix: uk.denncoffee
  deploymentTarget:
    iOS: "16.0"
settings:
  DEVELOPMENT_TEAM: ""
targets:
  AppMobileIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ĐENN
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # Lưới an toàn: trang web thỉnh thoảng redirect nội bộ qua http:// trước khi Cloudflare
        # nâng lại https:// — ATS chặn cứng hop http:// đó theo mặc định. Chỉ nới cho đúng domain
        # này (không NSAllowsArbitraryLoads toàn cục).
        NSAppTransportSecurity:
          NSExceptionDomains:
            denncoffee.uk:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.denncoffee.appmobileios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
