name: AppMobileIOS
options:
  bundleIdPrefix: uk.denncoffee
  deploymentTarget:
    iOS: "16.0"
settings:
  DEVELOPMENT_TEAM: ""
targets:
  AppMobileIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Assets.xcassets
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ĐENN
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.denncoffee.appmobileios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
